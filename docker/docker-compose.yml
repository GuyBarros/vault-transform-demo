version: "3.9"

services:
  # ── HashiCorp Vault (dev mode) ─────────────────────────────────────────────
  vault:
    image: hashicorp/vault-enterprise:latest
    container_name: vault-transform-demo
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_LICENSE: "" 
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_LOG_LEVEL: "info"
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - vault-demo-net

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres-transform-demo
    environment:
      POSTGRES_USER: vault_demo
      POSTGRES_PASSWORD: vault_demo
      POSTGRES_DB: vault_demo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../src/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - vault-demo-net

  # ── FastAPI Demo App ───────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: api-transform-demo
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root"
      DB_URL: "postgresql://vault_demo:vault_demo@postgres:5432/vault_demo"
      API_ROLE: "api-role"
      CORE_ROLE: "core-role"
    ports:
      - "8000:8000"
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - vault-demo-net
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  postgres_data:

networks:
  vault-demo-net:
    driver: bridge
